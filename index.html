<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับทำ Web & IoT & 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f4f6;
            background-image: url('public/image-main/พื้นหลัง.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding: 20px;
            color: #111827;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            padding: 48px 40px;
            max-width: 680px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2),
                        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        .title {
            font-size: 2.75rem;
            font-weight: 800;
            color: #000000;
            line-height: 1.25;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #111827;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 1.05rem;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .contact-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #000000;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .contact-box:hover {
            background: #1a1a1a;
            transform: scale(1.03);
        }

        .line-highlight {
            color: #06C755;
            font-weight: 800;
        }

        @media (max-width: 640px) {
            .glass-card {
                padding: 32px 20px;
            }
            .title {
                font-size: 2rem;
            }
            .tag {
                font-size: 0.95rem;
                padding: 8px 14px;
            }
            .contact-box {
                font-size: 1rem;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1 class="title">รับทำ Web & IoT & 3d</h1>

        <div class="tag-container">
            <span class="tag">ปริ้น PLA PETG TPU ABS PC</span>
            <span class="tag">Web B2B/B2C AR n8n Openclaw</span>
            <span class="tag">ESP32/STM32/Arduino/CH32</span>
        </div>

        <a href="https://line.me/ti/p/~0973355322" target="_blank" class="contact-box">
            <span>line <span class="line-highlight">0973355322</span></span>
        </a>
    </div>

</body>
</html>
